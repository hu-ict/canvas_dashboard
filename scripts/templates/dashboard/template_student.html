<a onclick="setStudentView('$student_name', '$student_number', '$student_role', '$target', '$url')"
    target="$target"
    href="$url"
    style="margin: 2px 0px; border-width: 4px"
    class="btn btn-sm student $btn_color">
        <span class="icon" style="color: $progress_color">
            <span class="fas fa-flag"></span>
        </span>
        <span class="text">$student_name</span>
        <span class="badge badge-secondary badge-counter">$bof_count</span>
</a>
